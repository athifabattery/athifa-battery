<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Attifa Battery</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:#fff;
  padding:15px
}
h2,h3{margin-top:15px}
.card{
  padding:15px;
  border-radius:8px;
  min-width:160px
}
.green{background:#16a34a}
.blue{background:#2563eb}
ul{list-style:none;padding:0}
li{
  background:#111827;
  padding:10px;
  border-radius:6px;
  margin-bottom:10px
}
.logout{
  background:#dc2626;
  color:#fff;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  margin-bottom:10px
}
</style>
</head>

<body>

<button class="logout" onclick="logout()">Logout</button>

<h2>📊 Dashboard Omzet</h2>

<div style="display:flex;gap:10px;flex-wrap:wrap">
  <div class="card green">
    <b>Total Omzet</b>
    <h3 id="totalOmzet">Rp 0</h3>
  </div>

  <div class="card blue">
    <b>Jumlah Order</b>
    <h3 id="totalOrder">0</h3>
  </div>
</div>

<h3>📦 Order Terbaru</h3>
<ul id="orderList"></ul>

<script type="module">

// 🔐 PROTEKSI LOGIN
if(localStorage.getItem("login") !== "ok"){
  window.location.href = "login.html";
}

// 🔥 FIREBASE IMPORT
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyA10eMVkOtOWrJyXBSpl032vM3tynEyRGY",
  authDomain: "athifa-battery-35228.firebaseapp.com",
  databaseURL: "https://athifa-battery-35228-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "athifa-battery-35228",
  storageBucket: "athifa-battery-35228.firebasestorage.app",
  messagingSenderId: "926672701476",
  appId: "1:926672701476:web:e60157b314a7762c0f70b1"
};

// 🔥 INIT
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 📊 DASHBOARD OMZET
const ordersRef = ref(db, "orders");

onValue(ordersRef, snap => {
  let omzet = 0;
  let count = 0;
  orderList.innerHTML = "";

  snap.forEach(o => {
    const d = o.val();
    count++;
    omzet += d.total || 0;

    const li = document.createElement("li");
    li.innerHTML = `
      🧾 <b>${new Date(d.tanggal).toLocaleString()}</b><br>
      Total: Rp ${Number(d.total).toLocaleString("id-ID")}
    `;
    orderList.appendChild(li);
  });

  totalOmzet.innerText = "Rp " + omzet.toLocaleString("id-ID");
  totalOrder.innerText = count;
});

// 🔓 LOGOUT
window.logout = function(){
  localStorage.removeItem("login");
  window.location.href = "login.html";
};

</script>

</body>
</html>
