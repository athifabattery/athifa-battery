<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#111827;padding:20px;border-radius:8px;width:100%;max-width:320px}
input,button{width:100%;padding:10px;margin-top:10px;border-radius:5px;border:none}
button{background:#22c55e;color:#000;font-weight:bold}
</style>
</head>

<body>

<div class="box">
  <h3>🔐 Login Admin</h3>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Masuk</button>
  <p id="msg"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA10eMVkOtOWrJyXBSpl032vM3tynEyRGY",
  authDomain: "athifa-battery-35228.firebaseapp.com",
  databaseURL: "https://athifa-battery-35228-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "athifa-battery-35228",
  storageBucket: "athifa-battery-35228.firebasestorage.app",
  messagingSenderId: "926672701476",
  appId: "1:926672701476:web:e60157b314a7762c0f70b1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.login = async function(){
  const u = user.value;
  const p = pass.value;

  const snap = await get(ref(db, "users/"+u));
  if(!snap.exists()){
    msg.innerText = "User tidak ditemukan";
    return;
  }

  const data = snap.val();
  if(data.password !== p){
    msg.innerText = "Password salah";
    return;
  }

  localStorage.setItem("login","ok");
  window.location.href = "admin.html";
};
</script>

</body>
</html>
